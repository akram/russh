[workspace]
members = ["russh", "russh-config", "cryptovec", "pageant", "russh-util"]
resolver = "2"

[workspace.dependencies]
aes = "0.9"
base16ct = "1"
byteorder = "1.4"
bytes = "1.7"
digest = "0.11.0"
delegate = "0.13"
env_logger = "0.11"
futures = "0.3"
hmac = "0.13"
log = "0.4.11"
rand = { version = "0.10", features = ["thread_rng"] }
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { version = "0.11", features = ["oid"] }
signature = "3"
ssh-encoding = { version = "0.3", features = ["bytes"] }
## `sha1` is intentionally left out here: PPK's own legacy (v2) KDF/MAC
## needs it only for the RustCrypto backends, forwarded conditionally from
## the `aws-lc-rs`/`ring` features in russh/Cargo.toml instead of
## unconditionally here, so the `openssl` build doesn't pull `sha1` at all
## (it has its own OpenSSL-backed path for the same operations).
ssh-key = { version = "=0.7.0-rc.12", features = [
    "encryption",
    "ppk",
] }
thiserror = "2.0.18"
tokio = { version = "1.17.0" }
tokio-stream = { version = "0.1.3", features = ["net", "sync"] }
