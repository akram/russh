[package]
name = "russh"
version = "0.65.2"
description = "A client and server SSH library."
authors = ["Pierre-Étienne Meunier <pe@pijul.org>"]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
readme = "../README.md"
documentation = "https://docs.rs/russh"
homepage = "https://github.com/warp-tech/russh"
repository = "https://github.com/warp-tech/russh"
keywords = ["ssh"]

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "ciphers"
harness = false

[dependencies]
# aes/cbc/ctr back AES-CBC/AES-CTR for the aws-lc-rs/ring backends (cbc is
# also needed for 3des-cbc under `des`, independent of backend). The
# `openssl` backend has its own path in cipher/openssl_block.rs.
aes = { workspace = true, optional = true }
aws-lc-rs = { version = "1.16.2", optional = true, default-features = false, features = [
    "alloc",
    "aws-lc-sys",
] }
bitflags = "2.0"
block-padding = { version = "0.4" }
byteorder.workspace = true
bytes.workspace = true
cbc = { version = "0.2", optional = true }
cipher = "0.5.1" # only pinned due to a cargo-minimal-versions failure in 0.5.0
criterion = { version = "0.7", optional = true, features = ["html_reports"] }
crypto-bigint = { version = "0.7.3", features = ["alloc"] }
ctr = { version = "0.10", optional = true }
curve25519-dalek = { version = "5", optional = true }
data-encoding = "2.3"
delegate.workspace = true
der = "0.8"
des = { version = "0.9", optional = true }
digest.workspace = true
ecdsa = { version = "0.17", optional = true }
ed25519-dalek = { version = "3", optional = true, features = ["alloc", "rand_core", "pkcs8"] }
elliptic-curve = { version = "0.14", optional = true, features = ["ecdh"] }
enum_dispatch = "0.3.13"
flate2 = { version = "1.0.15", optional = true }
futures.workspace = true
generic-array = "1.3.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
ghash = "0.6.0" # only pinned due to a cargo-minimal-versions failure in 0.6.0-rc.3
hex-literal = "1"
hmac.workspace = true
inout = { version = "0.2", features = ["block-padding"] }
keccak = "0.2.0"
log.workspace = true
md5 = "0.8"
ml-kem = "0.3"
module-lattice = "0.2"
num-bigint = { version = "0.5", features = ["rand_0_10"] }
openssl = { version = "0.10", optional = true }
p256 = { version = "0.14", optional = true, features = ["ecdh"] }
p384 = { version = "0.14", optional = true, features = ["ecdh"] }
p521 = { version = "0.14", optional = true, features = ["ecdh"] }
pbkdf2 = "0.13"
pkcs1 = { version = "0.8", optional = true }
# `encryption` (pulls `pkcs5`/`pbes2`: aes/aes-gcm/cbc/ctr) is only needed by
# the RustCrypto-backed passphrase-protected PKCS#8 encrypt/decrypt path in
# keys/format/pkcs8.rs. The `openssl` backend has its own path there via
# `PKey::private_key_{to,from}_pkcs8_passphrase` and doesn't need it.
pkcs5 = { version = "0.8", optional = true }
pkcs8 = { version = "0.11", default-features = false, features = ["std"] }
polyval = "0.7.1" # only pinned due to a cargo-minimal-versions failure in 0.7.0
rand.workspace = true
rand_core = { version = "0.10.0" }
ring = { version = "0.17.14", optional = true }
rsa = { version = "0.10", optional = true }
russh-cryptovec = { version = "0.62.0", path = "../cryptovec", features = [
    "ssh-encoding",
] }
russh-util = { version = "0.52.0", path = "../russh-util" }
salsa20 = "0.11.0"
scrypt = "0.12.0"
sec1 = { version = "0.8", features = ["der"] }
sha1.workspace = true
sha2.workspace = true
sha3 = "0.12.0"
signature.workspace = true
spki = "0.8"
ssh-encoding.workspace = true
ssh-key.workspace = true
subtle = "2.4"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
typenum = "1.17"
universal-hash = "0.6.1" # only pinned due to a cargo-minimal-versions failure in 0.6.0
zeroize = "1.7"

[dev-dependencies]
# Cross-checked against the OpenSSL backend's own CBC/CTR implementation in
# cipher/openssl_block.rs's tests, regardless of which release feature set
# is active; never shipped (dev-only).
aes.workspace = true
cbc = "0.2"
ctr = "0.10"
anyhow = "1.0.4"
clap = { version = "4", features = ["derive"] }
env_logger.workspace = true
rand.workspace = true
ratatui = "0.30"
shell-escape = "0.1"
tempfile = "3.14.0"
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "rt-multi-thread",
    "time",
    "net",
    "sync",
    "macros",
    "process",
] }

[features]
default = ["flate2", "aws-lc-rs", "rsa"]
# Crypto backends: enable at least one of `aws-lc-rs`, `ring`, or `openssl`.
# `ed25519-dalek`/`curve25519-dalek` back Ed25519 PKCS#8 parsing/encoding and
# the X25519 KEX for the aws-lc-rs/ring backends; `p256`/`p384`/`p521`/
# `ecdsa`/`elliptic-curve` back the NIST-curve (ecdh-sha2-nistp*) KEX for
# those same backends. The `openssl` backend has its own OpenSSL-based path
# for all of these (see keys/format/pkcs8.rs, kex/x25519.rs,
# kex/ecdh_nistp.rs) and doesn't need any of those crates.
aws-lc-rs = [
    "dep:aws-lc-rs",
    "dep:ed25519-dalek",
    "dep:curve25519-dalek",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:ecdsa",
    "dep:elliptic-curve",
    "ssh-key/ed25519",
    "ssh-key/p256",
    "ssh-key/p384",
    "ssh-key/p521",
    "dep:pkcs5",
    "pkcs8/encryption",
    "dep:aes",
    "dep:cbc",
    "dep:ctr",
    "dep:rsa",
    "ssh-key/rsa-rust-crypto",
    "ssh-key/aes-rust-crypto",
] # Default crypto backend.
# Danger: 3DES cipher is insecure. Independent of the aws-lc-rs/ring/openssl
# choice above: 3des-cbc has no OpenSSL path here, so it keeps the
# RustCrypto `cbc` wrapper (and `aes`/`ctr` so this feature's own tests
# build in any backend combination).
des = ["dep:des", "dep:cbc", "dep:aes", "dep:ctr"]
# Danger: DSA algorithm is insecure.
dsa = ["ssh-key/dsa"]
# AEAD ciphers (aes*-gcm@openssh.com), and now also aes*-cbc/aes*-ctr, via
# system OpenSSL instead of ring/aws-lc-rs, for environments that require
# all cryptographic operations to go through a FIPS-certifiable OpenSSL
# build. Mutually exclusive with `ring`/`aws-lc-rs` for the ciphers it
# covers: when more than one of the three is enabled, `aws-lc-rs` wins,
# then `ring`, then `openssl` (same precedence the existing aws-lc-rs/ring
# pair already has in cipher/mod.rs and cipher/gcm.rs).
openssl = ["dep:openssl", "ssh-key/openssl"]
ring = [
    "dep:ring",
    "dep:ed25519-dalek",
    "dep:curve25519-dalek",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:ecdsa",
    "dep:elliptic-curve",
    "ssh-key/ed25519",
    "ssh-key/p256",
    "ssh-key/p384",
    "ssh-key/p521",
    "dep:pkcs5",
    "pkcs8/encryption",
    "dep:aes",
    "dep:cbc",
    "dep:ctr",
    "dep:rsa",
    "ssh-key/rsa-rust-crypto",
    "ssh-key/aes-rust-crypto",
] # Alternative crypto backend.
# Backend-agnostic: RSA key *type* support (ssh-key's own Mpint-based
# storage, PKCS#1 parsing via pkcs1). The RustCrypto `rsa` crate itself is
# forwarded from `aws-lc-rs`/`ring` below, not from here: those are the
# only backends whose RSA sign/verify/keygen/format code still needs it
# (the `openssl` backend has its own path for all of it). This does mean
# `aws-lc-rs`/`ring` alone (without `rsa`) also pull in `dep:rsa` now, as
# an unused dependency -- a build-size quirk, not a behavior change, for
# a combination this fork doesn't otherwise ship.
rsa = ["dep:pkcs1", "ssh-key/rsa"]
serde = ["ssh-key/serde"]
_bench = ["dep:criterion"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = [
    "io-util",
    "rt-multi-thread",
    "time",
    "net",
] }

[target.'cfg(windows)'.dependencies]
pageant = { version = "0.2", path = "../pageant" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
russh-sftp = "2.3.0"
tokio.workspace = true
tokio-stream.workspace = true

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tokio-fd = "0.3"
termion = "4"
